services:
  # 1. Backend API Server (Node.js + Express + Socket.IO)
  - type: web
    name: rishta24-backend
    env: node
    plan: free
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # Set your MongoDB Atlas Connection String in Render Dashboard
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: "*"
      - key: ADMIN_URL
        value: "*"

  # 2. Public Informational Website (React + Vite)
  - type: web
    name: rishta24-web
    env: static
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: ./web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 3. Admin Control Center (React + Vite)
  - type: web
    name: rishta24-admin
    env: static
    buildCommand: cd admin && npm install && npm run build
    staticPublishPath: ./admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
